<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/colors.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/effects.css">
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="p2g-icon.js"></script>
  <style>
    p2g-icon { display: inline-flex; line-height: 0; flex: none; }
    [data-nav] { color: hsl(0 0% 62%); background: transparent; border-left: 2px solid transparent; }
    [data-nav]:hover { color: #FAFAFA; background: hsl(0 0% 100% / 0.04); }
    [data-nav][data-on] { color: #C7F011; background: hsl(71 91% 51% / 0.09); border-left-color: #C7F011; }
  </style>
</helmet>

<aside style="background:linear-gradient(180deg, hsl(0 0% 4%), #000);border-right:1px solid hsl(0 0% 12%);display:flex;flex-direction:column;gap:4px;padding:0 0 24px;height:100%;overflow-y:auto">
  <div style="position:sticky;top:0;z-index:2;background:hsl(0 0% 4% / 0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid hsl(0 0% 12%);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px">
    <a href="Homepage.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none">
      <img src="assets/p2g-icon-clean.png" alt="PADEL2GO" style="height:28px;width:auto;display:block">
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;letter-spacing:-0.02em;color:#FAFAFA">PADEL<span style="color:#C7F011">2</span>GO</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#C7F011;background:hsl(71 91% 51% / 0.1);border:1px solid hsl(71 91% 51% / 0.3);border-radius:999px;padding:3px 8px">Admin</span>
    </a>
    <label style="position:relative;display:flex;align-items:center">
      <span style="position:absolute;left:11px;display:flex;color:hsl(0 0% 58%)"><p2g-icon name="search" size="15"></p2g-icon></span>
      <input type="text" placeholder="Suchen…" style="width:100%;height:38px;padding:0 12px 0 36px;box-sizing:border-box;font-family:'DM Sans',sans-serif;font-size:14px;color:#FAFAFA;background:hsl(0 0% 100% / 0.04);border:1px solid hsl(0 0% 14%);border-radius:11px;outline:none;transition:border-color 0.2s" style-focus="border-color:#C7F011">
    </label>
  </div>

  <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="5">
    <div style="display:flex;flex-direction:column;gap:1px;padding:12px 0 4px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:hsl(0 0% 58%);padding:0 18px 8px">{{ g.label }}</span>
      <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" data-nav="1" data-key="{{ n.key }}" style="display:flex;align-items:center;gap:11px;padding:9px 18px;text-decoration:none;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;transition:color 0.15s, background 0.15s">
          <p2g-icon name="{{ n.icon }}" size="16"></p2g-icon>
          <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ n.label }}</span>
          <sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}">
            <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#C7F011;background:hsl(71 91% 51% / 0.1);border-radius:999px;padding:2px 7px;flex:none">{{ n.count }}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="margin-top:auto;padding:18px 18px 0;display:flex;flex-direction:column;gap:8px;border-top:1px solid hsl(0 0% 12%)">
    <a href="Homepage.dc.html" style="display:flex;align-items:center;gap:9px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:hsl(0 0% 58%);text-decoration:none" style-hover="color:#C7F011">
      <p2g-icon name="external-link" size="14"></p2g-icon>Zur Website
    </a>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:hsl(0 0% 40%)">v2.4 · Build 1042</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 258, &quot;height&quot;: 900 },
  &quot;active&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;overview&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
const GROUPS = [
  { label: 'Übersicht', items: [
    { key: 'overview', label: 'Overview', icon: 'layout-dashboard', href: 'Admin 01 Overview.dc.html' },
    { key: 'analytics', label: 'Analytics', icon: 'chart-line', href: 'Admin 21 Analytics.dc.html' },
    { key: 'utilization', label: 'Auslastung', icon: 'gauge', href: 'Admin 04 Auslastung.dc.html' },
  ] },
  { label: 'Betrieb', items: [
    { key: 'bookings', label: 'Buchungen', icon: 'calendar', href: 'Admin 02 Buchungen.dc.html', hasCount: true, count: '38' },
    { key: 'courts', label: 'Courts & Standorte', icon: 'map-pin', href: 'Admin 03 Courts.dc.html' },
    { key: 'clubs', label: 'Clubs', icon: 'building-2', href: 'Admin 05 Clubs.dc.html' },
    { key: 'owners', label: 'Club Owners', icon: 'key-round', href: 'Admin 06 Club Owners.dc.html' },
    { key: 'events', label: 'Events', icon: 'ticket', href: 'Admin 07 Events.dc.html' },
  ] },
  { label: 'Commerce', items: [
    { key: 'marketplace', label: 'Marketplace', icon: 'shopping-bag', href: 'Admin 08 Marketplace.dc.html', hasCount: true, count: '7' },
    { key: 'points', label: 'P2G Points', icon: 'coins', href: 'Admin 09 P2G Points.dc.html' },
    { key: 'vouchers', label: 'Vouchers', icon: 'tag', href: 'Admin 10 Vouchers.dc.html' },
  ] },
  { label: 'Content', items: [
    { key: 'teasers', label: 'Location Teasers', icon: 'megaphone', href: 'Admin 11 Location Teasers.dc.html' },
    { key: 'gallery', label: 'SkyPadel Galerie', icon: 'images', href: 'Admin 12 SkyPadel Galerie.dc.html' },
    { key: 'partners', label: 'Partner-Kacheln', icon: 'handshake', href: 'Admin 13 Partner-Kacheln.dc.html' },
    { key: 'slides', label: 'Touchpoint Slides', icon: 'gallery-horizontal', href: 'Admin 14 Touchpoint Slides.dc.html' },
    { key: 'qr', label: 'QR-Panel', icon: 'qr-code', href: 'Admin 15 QR-Panel.dc.html' },
    { key: 'news', label: 'News / Artikel', icon: 'newspaper', href: 'Admin 16 News.dc.html' },
    { key: 'colors', label: 'Farben', icon: 'palette', href: 'Admin 17 Farben.dc.html' },
    { key: 'visuals', label: 'Visuals', icon: 'image', href: 'Admin 22 Visuals.dc.html' },
  ] },
  { label: 'System', items: [
    { key: 'users', label: 'Benutzer', icon: 'users', href: 'Admin 18 Benutzer.dc.html' },
    { key: 'notifications', label: 'Mitteilungen', icon: 'bell', href: 'Admin 19 Mitteilungen.dc.html' },
    { key: 'newsletter', label: 'Newsletter', icon: 'mail', href: 'Admin 20 Newsletter.dc.html' },
    { key: 'integrations', label: 'Integrationen', icon: 'plug', href: 'Admin 23 Integrationen.dc.html' },
    { key: 'features', label: 'Features', icon: 'toggle-right', href: 'Admin 24 Features.dc.html' },
    { key: 'settings', label: 'Einstellungen', icon: 'settings', href: 'Admin 25 Einstellungen.dc.html' },
  ] },
];

class Component extends DCLogic {
  componentDidMount() { this._paint(); }
  componentDidUpdate() { this._paint(); }
  _paint() {
    const key = this.props.active || '';
    let n = 0;
    const run = () => {
      document.querySelectorAll('[data-nav][data-key]').forEach((a) => {
        a.toggleAttribute('data-on', a.dataset.key === key);
      });
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
      n += 1;
      if (n < 8) setTimeout(run, 300);
    };
    run();
  }
  renderVals() { return { navGroups: GROUPS }; }
}
</script>
</body>
</html>
