<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/colors.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/typography.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/tokens/effects.css">
  <link rel="stylesheet" href="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/styles.css">
  <script src="_ds/padel2go-design-system-1e83ca8e-0a96-4799-8c02-846a1409d2bf/_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="p2g-icon.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #000; color: #FAFAFA; }
    body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    p2g-icon { display: inline-flex; line-height: 0; flex: none; }
    #na-screen { --acc: #C7F011; isolation: isolate; }
    [data-scroll] { scrollbar-width: none; }
    [data-scroll]::-webkit-scrollbar { display: none; }
    [data-scroll] > * { flex-shrink: 0; }
    #na-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 18px 0; }
    #na-chips::-webkit-scrollbar { display: none; }
    /* chip colors live in CSS: the runtime owns template-declared inline styles */
    #na-chips button[data-topic] { color: hsl(0 0% 70%); background: hsl(0 0% 100% / 0.04); border: 1px solid hsl(0 0% 16%); }
    #na-chips button[data-topic="Alle"], #na-chips button[data-topic="Inside P2G"] { --c: #C7F011; }
    #na-chips button[data-topic="Events"] { --c: #B06BFF; }
    #na-chips button[data-topic="Marketplace"] { --c: #FF8A1F; }
    #na-chips button[data-topic="Community"] { --c: #FF4D4D; }
    #na-chips button[data-topic="Business"] { --c: #2FE0C0; }
    #na-chips button[data-topic] [data-dot] { background: var(--c); }
    #na-chips button[data-on] { color: #0A0A0A; background: var(--c); border-color: var(--c); }
    #na-chips button[data-on] [data-dot] { background: #0A0A0A; }
    #na-feed { scroll-snap-type: y proximity; }
    #na-feed > a { scroll-snap-align: start; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="min-height:100vh;background:radial-gradient(ellipse 60% 36% at 50% 0%, hsl(71 91% 51% / 0.07), transparent), #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:44px 24px">

  <div style="display:flex;align-items:center;gap:10px">
    <img src="assets/p2g-icon-clean.png" alt="PADEL2GO" style="height:26px;width:auto;display:block">
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;letter-spacing:-0.02em;color:#FAFAFA">PADEL<span style="color:#C7F011">2</span>GO <span style="color:hsl(0 0% 45%);font-weight:600">· News</span></span>
  </div>

  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">
    <div id="na-screen" ref="{{ rootRef }}" data-screen-label="App — News" style="height:100%;position:relative;background:#000;overflow:hidden;font-family:'DM Sans',sans-serif">

      <!-- ═══ HEADER ═══ -->
      <div style="position:absolute;top:0;left:0;right:0;z-index:30;background:hsl(0 0% 2% / 0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid hsl(0 0% 14%);padding:58px 0 12px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px">
          <div style="display:flex;flex-direction:column;gap:1px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--acc)">P2G Network</span>
            <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em;color:#FAFAFA;margin:0">News</h1>
          </div>
          <button style="width:40px;height:40px;position:relative;display:flex;align-items:center;justify-content:center;color:hsl(0 0% 72%);background:hsl(0 0% 100% / 0.04);border:1px solid hsl(0 0% 16%);border-radius:50%;cursor:pointer">
            <p2g-icon name="bell" size="18"></p2g-icon>
            <span style="position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--acc)"></span>
          </button>
        </div>
        <div id="na-chips" ref="{{ chipsRef }}">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
            <button onClick="{{ c.pick }}" data-topic="{{ c.label }}" style="flex:none;display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;border-radius:999px;padding:8px 15px;cursor:pointer;white-space:nowrap;transition:color 0.2s, background 0.2s, border-color 0.2s">
              <span data-dot="1" style="width:6px;height:6px;border-radius:50%;flex:none"></span>{{ c.label }}
            </button>
          </sc-for>
        </div>
      </div>

      <!-- ═══ FEED (4:5 Posts) ═══ -->
      <div id="na-feed" data-scroll style="position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;padding:146px 18px 118px;display:flex;flex-direction:column;gap:18px">

        <sc-for list="{{ posts }}" as="p" hint-placeholder-count="0">
          <a href="News Artikel App.dc.html" style="flex:none;display:flex;flex-direction:column;gap:0;text-decoration:none;border-radius:22px;overflow:hidden;border:1px solid hsl(0 0% 15%);background:linear-gradient(145deg, hsl(0 0% 8%), hsl(0 0% 3%));animation:fadeUp 0.45s cubic-bezier(0.16,1,0.3,1)">
            <div style="position:relative;aspect-ratio:4 / 5">
              <div role="img" aria-label="{{ p.title }}" style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:url({{ p.img }});background-size:cover;background-position:center"></div>
              <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(190deg, hsl(0 0% 0% / 0.12) 26%, hsl(0 0% 0% / 0.9) 90%)"></div>
              <span style="position:absolute;top:14px;left:14px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:{{ p.acc }};background:hsl(0 0% 0% / 0.62);backdrop-filter:blur(10px);border:1px solid {{ p.accBorder }};border-radius:999px;padding:5px 11px;white-space:nowrap">{{ p.cat }}</span>
              <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:20px">
                <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:hsl(0 0% 62%)">{{ p.date }} · {{ p.read }}</span>
                <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;line-height:1.14;letter-spacing:-0.015em;color:#FAFAFA;margin:0">{{ p.title }}</h2>
                <p style="font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;color:hsl(0 0% 74%);margin:0">{{ p.excerpt }}</p>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px">
              <div style="display:flex;align-items:center;gap:14px">
                <span onClick="{{ p.like }}" style="display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:{{ p.likeColor }}"><p2g-icon name="heart" size="16"></p2g-icon>{{ p.likes }}</span>
                <span style="display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:hsl(0 0% 55%)"><p2g-icon name="message-circle" size="16"></p2g-icon>{{ p.comments }}</span>
                <span style="display:inline-flex;align-items:center;color:hsl(0 0% 55%)"><p2g-icon name="share-2" size="16"></p2g-icon></span>
              </div>
              <span style="display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:{{ p.acc }}">Lesen <p2g-icon name="arrow-right" size="14"></p2g-icon></span>
            </div>
          </a>
        </sc-for>

        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:56px 24px">
            <span style="width:60px;height:60px;border-radius:18px;background:hsl(0 0% 100% / 0.05);border:1px solid hsl(0 0% 18%);display:flex;align-items:center;justify-content:center;color:var(--acc)"><p2g-icon name="newspaper" size="26"></p2g-icon></span>
            <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#FAFAFA">Noch nichts hier</span>
            <span style="font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;color:hsl(0 0% 58%);max-width:220px">In diesem Topic gibt es aktuell keine Beiträge.</span>
          </div>
        </sc-if>

        <sc-if value="{{ notEmpty }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 0 2px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:hsl(0 0% 40%)">
            <span style="width:26px;height:1px;background:hsl(0 0% 20%)"></span> Alles gelesen <span style="width:26px;height:1px;background:hsl(0 0% 20%)"></span>
          </div>
        </sc-if>
      </div>

      <!-- ═══ TAB-BAR ═══ -->
      <div style="position:absolute;bottom:0;left:0;right:0;z-index:30;background:hsl(0 0% 2% / 0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid hsl(0 0% 14%);display:grid;grid-template-columns:repeat(5, 1fr);padding:9px 6px 26px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <button style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;background:none;border:none;cursor:pointer;transition:color 0.2s;color:{{ t.color }}">
            <p2g-icon name="{{ t.icon }}" size="21"></p2g-icon>
            <span style="font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.01em">{{ t.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* 5 Topics (Alle + 5) — jedes mit eigenem Colorcode. "Alle" = Brand-Lime. */
const TOPICS = {
  'Alle': '#C7F011',
  'Inside P2G': '#C7F011',
  'Events': '#B06BFF',
  'Marketplace': '#FF8A1F',
  'Community': '#FF4D4D',
  'Business': '#2FE0C0',
};

const ALL = [
  { cat: 'Inside P2G', date: '28.07.2026', read: '3 Min', img: 'assets/skypadel-outdoor.jpg', title: 'München-Ost geht live', excerpt: 'Zwei mobile Courts, KI-Kamera und Flutlicht — ab August bespielbar.', likes: 248, comments: 19 },
  { cat: 'Events', date: '24.07.2026', read: '2 Min', img: 'assets/events-hero.jpg', title: 'Padel Night: Turnierserie startet', excerpt: 'Sechs Standorte, ein Format — jeden Monat um Points spielen.', likes: 512, comments: 44 },
  { cat: 'Community', date: '19.07.2026', read: '2 Min', img: 'assets/skypadel-sunset.jpg', title: 'Golden Hour Sessions', excerpt: 'Jeden Freitag Sunset-Padel auf ausgewählten Courts.', likes: 331, comments: 22 },
  { cat: 'Marketplace', date: '15.07.2026', read: '2 Min', img: 'assets/rewards-hero.jpg', title: 'Neue Rackets im Marketplace', excerpt: 'Ab jetzt auch komplett mit P2G Points einlösbar.', likes: 176, comments: 12 },
  { cat: 'Inside P2G', date: '11.07.2026', read: '5 Min', img: 'assets/padel-norway.jpg', title: 'Wie wir einen Court in 11 Tagen bauen', excerpt: 'Vom Fundamentcheck bis zum ersten Aufschlag — hinter den Kulissen.', likes: 289, comments: 27 },
  { cat: 'Inside P2G', date: '07.07.2026', read: '3 Min', img: 'assets/tennis-padel-aerial.jpg', title: 'Hamburg: Bauantrag ist durch', excerpt: 'Der Standort an der Alster startet im Frühjahr mit drei Courts.', likes: 203, comments: 8 },
  { cat: 'Business', date: '02.07.2026', read: '4 Min', img: 'assets/fuer-vereine-hero.jpg', title: 'Padel ohne Investment', excerpt: 'Revenue-Share statt Eigenkapital — das Modell für Vereine.', likes: 158, comments: 9 },
  { cat: 'Events', date: '26.06.2026', read: '2 Min', img: 'assets/league-hero.jpg', title: 'Recap: Season Opening Köln', excerpt: '64 Spieler, 12 Stunden Padel und ein Finale, das keiner erwartet hat.', likes: 397, comments: 31 },
  { cat: 'Inside P2G', date: '22.06.2026', read: '4 Min', img: 'assets/skypadel-outdoor.jpg', title: 'Was hinter unserer KI-Analyse steckt', excerpt: 'Wie aus Kamerabildern Heatmaps und dein Match-Score werden.', likes: 264, comments: 17 },
  { cat: 'Community', date: '12.06.2026', read: '3 Min', img: 'assets/events-hero.jpg', title: 'Neue Spielpartner finden', excerpt: 'Matchmaking nach Level — direkt in der App.', likes: 221, comments: 15 },
];

class Component extends DCLogic {
  state = { cat: 'Alle', liked: {} };

  componentDidMount() {
    let n = 0;
    this._iv = setInterval(() => {
      n += 1;
      this._sync();
      if ((window.lucide && n > 2) || n > 20) clearInterval(this._iv);
    }, 350);
  }
  componentWillUnmount() { clearInterval(this._iv); }
  componentDidUpdate() { this._sync(); }
  _sync() {
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    if (this._root) this._root.style.setProperty('--acc', TOPICS[this.state.cat] || TOPICS['Alle']);
    this._paintChips(this.state.cat);
  }

  /* The runtime re-asserts template-declared inline styles, so the active
     chip is styled in CSS and only an undeclared attribute is toggled. */
  _paintChips(active, scope) {
    const box = scope || this._chips || document.getElementById('na-chips');
    if (!box) return;
    box.querySelectorAll('button[data-topic]').forEach((b) => {
      b.toggleAttribute('data-on', b.dataset.topic === active);
    });
  }

  renderVals() {
    const active = this.state.cat;
    const filtered = active === 'Alle' ? ALL : ALL.filter((p) => p.cat === active);
    const tabs = [
      { label: 'Mein P2G', icon: 'house', on: false },
      { label: 'Buchen', icon: 'calendar', on: false },
      { label: 'News', icon: 'newspaper', on: true },
      { label: 'Shop', icon: 'shopping-bag', on: false },
      { label: 'Profil', icon: 'user', on: false },
    ];
    return {
      cats: Object.keys(TOPICS).map((label) => {
        return {
          label,
          pick: (e) => {
            const btn = e.currentTarget;
            this._paintChips(label, btn.parentElement);
            if (this._root) this._root.style.setProperty('--acc', TOPICS[label]);
            this.setState({ cat: label });
          },
        };
      }),
      posts: filtered.map((p) => {
        const liked = !!this.state.liked[p.title];
        const acc = TOPICS[p.cat];
        return {
          ...p,
          acc,
          accBorder: acc + '66',
          likes: p.likes + (liked ? 1 : 0),
          likeColor: liked ? acc : 'hsl(0 0% 55%)',
          like: (e) => {
            e.preventDefault();
            this.setState((s) => ({ liked: { ...s.liked, [p.title]: !s.liked[p.title] } }));
          },
        };
      }),
      isEmpty: filtered.length === 0,
      notEmpty: filtered.length > 0,
      rootRef: (el) => { this._root = el; this._sync(); },
      chipsRef: (el) => { this._chips = el; this._sync(); },
      tabs: tabs.map((t) => ({
        ...t,
        color: t.on ? 'var(--acc)' : 'hsl(0 0% 45%)',
      })),
    };
  }
}
</script>
</body>
</html>
